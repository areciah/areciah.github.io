<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100e13">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:image" content="{{ site.url }}{{ '/assets/archive-icon.png' | relative_url }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" href="{{ '/assets/archive-icon.png' | relative_url }}?v=box-1" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/archive-icon.png' | relative_url }}?v=box-1">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=writing-first-1">
    <script>try{if(!sessionStorage.getItem('arecia-intro-archive-v5'))document.documentElement.classList.add('intro-pending')}catch(e){document.documentElement.classList.add('intro-pending')}</script>
  </head>
  <body>
    <div class="intro" id="intro" aria-label="블로그 시작 화면">
      <div class="intro-inner">
        <p class="intro-top">ARECIA / ACTIVE ARCHIVE <span>SYS.01</span></p>
        <div class="intro-center">
          <img class="intro-symbol" src="{{ '/assets/archive-icon.png' | relative_url }}" alt="" width="80" height="80" aria-hidden="true">
          <p class="intro-command">$ open /archive<span class="cursor">_</span></p>
          <h2>Archive<br><span>online.</span></h2>
          <p class="intro-log">아카이브 연결 중...</p>
        </div>
        <div class="intro-bottom"><span>EXPLORE · ANALYZE · LOG</span></div>
        <div class="intro-progress" aria-hidden="true"></div>
      </div>
    </div>
    <div class="site-shell">
      <a class="skip-link" href="#content">본문으로 이동</a>
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 홈">
          <img class="brand-mark" src="{{ '/assets/archive-icon.png' | relative_url }}" alt="" width="38" height="38" aria-hidden="true">
          <span class="brand-name">{{ site.title }}</span>
        </a>
        <nav class="site-nav" aria-label="주 메뉴">
          <a href="{{ '/' | relative_url }}">홈</a>
          <a href="{{ '/posts/' | relative_url }}">글</a>
          <a href="{{ '/' | relative_url }}#work">프로젝트</a>
          <a href="{{ '/cv/' | relative_url }}">소개</a>
        </nav>
      </header>

      <main id="content" tabindex="-1">{{ content }}</main>

      <footer class="site-footer">
        <div>
          <span class="footer-mark"><img src="{{ '/assets/archive-icon.png' | relative_url }}" alt="" width="29" height="29" aria-hidden="true">{{ site.title }}</span>
          <p>STATUS / IN PROGRESS</p>
        </div>
        <span>© {{ 'now' | date: '%Y' }} {{ site.title }} / END OF FILE</span>
      </footer>
    </div>
    <script src="{{ '/assets/site.js' | relative_url }}?v=status-2" defer></script>
  </body>
</html>
