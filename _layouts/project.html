---
layout: default
---
<article class="post-page">
  <a class="back-link" href="{{ '/cv/' | relative_url }}#projects">프로젝트 목록</a>
  <header class="post-header">
    <p class="post-meta">{{ page.topic | escape }}</p>
    <h1>{{ page.title | escape }}</h1>
    <p class="post-deck">{{ page.description | escape }}</p>
    {% if page.role and page.role != empty %}<p><strong>맡은 역할</strong> · {{ page.role | escape }}</p>{% endif %}
  </header>
  <div class="post-body">{{ content }}</div>
</article>
