---
layout: default
title: 글
description: arecia의 글을 카테고리별로 읽어보세요.
---
<section class="container writing-archive" aria-labelledby="archive-title">
  <div class="section-heading">
    <h1 id="archive-title">전체 글<span class="accent">.</span></h1>
    <span class="post-count" id="archive-count" aria-live="polite">글 {{ site.posts.size }}편</span>
  </div>
  {% if site.posts.size > 0 %}
  <div class="archive-filters" id="archive-filters" hidden>
    <label>카테고리
      <select id="archive-category">
        <option value="">전체</option>
        {% assign categories = site.categories | sort %}
        {% for category in categories %}<option value="{{ category[0] | escape }}">{{ category[0] | escape }}</option>{% endfor %}
        {% assign uncategorized = site.posts | where_exp: 'post', 'post.categories == empty' %}
        {% if uncategorized.size > 0 %}<option data-uncategorized>미분류</option>{% endif %}
      </select>
    </label>
    {% if site.tags.size > 0 %}
    <label>태그
      <select id="archive-tag">
        <option value="">전체</option>
        {% assign tags = site.tags | sort %}
        {% for tag in tags %}<option value="{{ tag[0] | escape }}">{{ tag[0] | escape }}</option>{% endfor %}
      </select>
    </label>
    {% endif %}
    <label>정렬
      <select id="archive-order">
        <option value="newest">최신순</option>
        <option value="oldest">오래된순</option>
      </select>
    </label>
  </div>
  <div class="post-list" id="archive-list">
    {% for post in site.posts %}{% include post-row.html %}{% endfor %}
  </div>
  <script src="{{ '/assets/posts.js' | relative_url }}" defer></script>
  {% else %}<p class="empty-state">아직 공개한 글이 없습니다.</p>{% endif %}
</section>
